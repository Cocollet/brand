# Régénère les fichiers publiés à chaque changement d'une source, puis prévient les applis
# qui gardent une copie de la charte (status, anonymizer).
name: build

on:
  push:
    branches: [main]
    paths: ["tokens.json", "src/**", "build.mjs", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Générer
        run: node build.mjs  # Node préinstallé sur ubuntu-latest, aucune dépendance
      - name: Publier les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tokens.css manifest.json index.html logo mascots apps
          if git diff --cached --quiet; then echo "Rien à publier"; exit 0; fi
          git commit -qm "Régénérer la charte publiée (build.mjs)"
          git push -q origin HEAD:main
      # Facultatif : avec le secret BRAND_DISPATCH_TOKEN (jeton fine-grained, « Contents: read and write »
      # sur Cocollet/status et Cocollet/anonymizer), les applis récupèrent la charte tout de suite ;
      # sans lui, leur workflow sync-brand passe chaque nuit.
      - name: Prévenir les applis
        env:
          GH_TOKEN: ${{ secrets.BRAND_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Pas de BRAND_DISPATCH_TOKEN : les applis se synchroniseront cette nuit"; exit 0; fi
          sleep 60  # laisser GitHub Pages publier la nouvelle version
          for repo in Cocollet/status Cocollet/anonymizer; do
            gh api "repos/$repo/dispatches" -f event_type=brand-updated --silent && echo "prévenu : $repo"
          done
